<template>
    <lightning-card title="Interview Command Center" icon-name="standard:coaching">
        
        <!-- Summary Strip (Top Panel) -->
        <div class="slds-p-horizontal_medium slds-m-bottom_medium">
            <div class="slds-grid slds-gutters">
                <template if:true={summaryData}>
                    <template for:each={summaryData} for:item="item">
                        <div key={item.key} class="slds-col slds-size_1-of-4">
                            <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                                <span class="slds-text-title_caps">{item.key}</span>
                                <h2 class="slds-text-heading_medium">{item.value}</h2>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </div>

        <!-- Main Datatable Body -->
        <div class="slds-p-horizontal_medium">
            <template if:true={hasData}>
                <lightning-datatable
                    key-field="Id"
                    data={rounds}
                    columns={columns}
                    draft-values={draftValues}
                    onsave={handleSave}
                    oncancel={handleCancel}>
                </lightning-datatable>
            </template>

            <!-- Designed Empty State (No Data Case) -->
            <template if:false={hasData}>
                <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No Interview Rounds Found</h3>
                        <p class="slds-text-body_regular">There are currently no interview rounds linked to this Job Opening.</p>
                    </div>
                </div>
            </template>
        </div>

    </lightning-card>
</template>
