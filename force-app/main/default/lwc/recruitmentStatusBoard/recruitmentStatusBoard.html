<template>
    <lightning-card title="Recruitment Pipeline Status Board" icon-name="standard:kanban">
        <div class="slds-var-p-around_medium">
            <p class="slds-text-heading_small">Active Stage Filter: <strong>{activeStageFilter}</strong></p>
            
            <div class="slds-var-m-top_medium">
                <!-- Getter reactivity with lwc:if directive -->
                <template lwc:if={isAllSelected}>
                    <p class="slds-text-color_success">Showing candidates across all pipeline stages.</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">Filtering pipeline records for stage: <strong>{activeStageFilter}</strong></p>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
